        "200":
          $ref: "#/components/schemas/SuccessResponse"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: unfollowCreator
      tags: [Creators]
      summary: 크리에이터 언팔로우
      description: 크리에이터를 언팔로우합니다.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
